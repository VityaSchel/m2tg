[package]
name = "m2tg"
version = "2.0.0"
rust-version = "1.86"
description = "Matrix appservice that forwards a room to a Telegram chat"
authors = ["Viktor Shchelochkov <hi@hloth.dev>"]
repository = "https://git.hloth.dev/hloth/m2tg"
license = "MIT"
edition = "2024"
publish = false

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
bytes = "1.12.1"
html5ever = "0.39.0"
markup5ever_rcdom = "0.39.0"
reqwest = { version = "0.13.4", default-features = false, features = [
	"multipart",
	"json",
	"rustls-no-provider",
] }
rustls = { version = "0.23.45", default-features = false, features = [
	"ring",
	"std",
	"tls12",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.53.0", features = [
	"rt-multi-thread",
	"macros",
	"sync",
	"time",
	"signal",
] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
urlencoding = "2.1.3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[dev-dependencies]
axum = { version = "0.8.9", features = ["multipart"] }
dotenvy = "0.15.7"
tokio = { version = "1.53.0", features = ["test-util"] }
tower = { version = "0.5.3", features = ["util"] }
